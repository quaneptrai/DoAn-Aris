<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aris Career Studio — Login V2 (Quỹ Đạo Điêu Khắc)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Dark stage. The pale palette was the literal complaint: light blue on
         near-white cannot carry a hero. Both reference pages put the artwork
         on black and let it emit light. */
      --aris-bg: #05070E;
      --aris-text-main: #EEF3FF;
      --aris-text-sub: #9DAAC6;
      --aris-text-muted: #6E7C9B;
      --aris-blue: #2F6FED;
      --aris-blue-hover: #4785F5;
      --aris-blue-glow: rgba(47, 111, 237, 0.45);
      --aris-border: rgba(255, 255, 255, 0.10);
      --aris-input-border: rgba(255, 255, 255, 0.16);
      --aris-danger: #FF7B7B;
      --aris-danger-text: #FFB4B4;
      --aris-danger-bg: rgba(255, 90, 90, 0.10);
      --aris-radius: 12px;
      --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-stack);
      background: var(--aris-bg);
      color: var(--aris-text-main);
      min-height: 100vh;
      /* A single low wash keeps the black from going flat. */
      background-image: radial-gradient(120% 80% at 38% 42%, rgba(47,111,237,0.13), transparent 62%);
      background-attachment: fixed;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Dev Controller Dock (Collapsible) */
    .dev-panel {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      font-size: 12px;
      color: #E2E8F0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dev-panel.dev-hidden {
      display: none !important;
    }
    .dev-panel.minimized {
      transform: translateX(-50%) translateY(70px);
      opacity: 0.2;
    }
    .dev-panel.minimized:hover {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .dev-title {
      font-weight: 600;
      color: #94A3B8;
      margin-right: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dev-btn {
      background: #1E293B;
      border: 1px solid #334155;
      color: #CBD5E1;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .dev-btn:hover { background: #334155; color: #FFFFFF; }
    .dev-btn.active {
      background: var(--aris-blue);
      border-color: var(--aris-blue);
      color: #FFFFFF;
      font-weight: 600;
    }
    .dev-toggle-hide {
      background: transparent;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 13px;
      border-left: 1px solid #334155;
      margin-left: 4px;
    }

    /* Master Layout Container */
    .app-shell {
      flex: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      width: 100%;
      max-width: 1560px;
      margin: 0 auto;
      position: relative;
    }

    /* Header */
    .site-header {
      padding: 36px 64px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--aris-text-main);
    }
    .header-aside {
      font-size: 14px;
      color: var(--aris-text-sub);
    }
    .header-aside a {
      color: var(--aris-blue);
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }
    .header-aside a:hover { text-decoration: underline; }

    /* Main Stage: Sculpture + Form */
    .stage-main {
      display: grid;
      grid-template-columns: 1.35fr 400px;
      align-items: center;
      padding: 10px 64px 30px;
      gap: 50px;
      position: relative;
    }

    /* Left Column: narrative and artwork side by side, never overlapping. */
    .left-hero-column {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
    }
    .hero-narrative { position: relative; z-index: 2; }

    /* Artwork gets its own cell and its own bounds. */
    .visual-theater {
      position: relative;
      width: 100%;
      height: 520px;
      margin-left: -6%;
      z-index: 0;
    }
    .orbit-figure {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .orbit-figure canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Geometry source only, never painted. Codex's note stands: a ghosted
       wordmark is not compositional dominance, so it is gone and the sculpture
       itself has to carry the frame. */
    .orbit-source {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .hero-narrative {
      position: relative;
      max-width: 480px;
    }
    .hero-caption {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--aris-blue);
      background: rgba(47, 111, 237, 0.08);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .hero-headline {
      font-size: 58px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--aris-text-main);
      margin-bottom: 20px;
    }
    .hero-subheadline {
      font-size: 17px;
      line-height: 1.55;
      color: var(--aris-text-sub);
      max-width: 420px;
    }

    /* Right Form Stage */
    .form-stage {
      position: relative;
      z-index: 10;
      isolation: isolate;
      display: flex;
      justify-content: flex-end;
    }
    .form-pod {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--aris-border);
      border-radius: 24px;
      padding: 38px 32px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px -16px rgba(0, 0, 0, 0.7);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pod-heading {
      font-size: 26px;
      font-weight: 700;
      color: var(--aris-text-main);
      letter-spacing: -0.025em;
      margin-bottom: 8px;
    }
    .pod-desc {
      font-size: 14.5px;
      color: var(--aris-text-sub);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* Form Elements */
    .control-group {
      margin-bottom: 20px;
      position: relative;
    }
    .control-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--aris-text-main);
      margin-bottom: 8px;
    }
    .control-input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1px solid var(--aris-input-border);
      border-radius: var(--aris-radius);
      font-size: 16px;
      font-family: inherit;
      color: var(--aris-text-main);
      background: #FFFFFF;
      transition: all 0.18s ease-out;
      outline: none;
    }
    .control-input:hover { border-color: #94A3B8; }
    .control-input:focus {
      border-color: var(--aris-blue);
      box-shadow: 0 0 0 3.5px var(--aris-blue-glow);
    }
    .control-input.input-error {
      border-color: var(--aris-danger) !important;
      background: #FFFDFD;
    }
    .control-input.input-error:focus {
      box-shadow: 0 0 0 3.5px rgba(220, 38, 38, 0.15) !important;
    }

    .error-announcement {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: var(--aris-danger-text);
      background: var(--aris-danger-bg);
      border: 1px solid #FECACA;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 10px;
      line-height: 1.4;
    }
    .error-announcement svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 2px;
      fill: var(--aris-danger);
    }

    /* CTA Button */
    .btn-action-primary {
      width: 100%;
      height: 52px;
      background: var(--aris-blue);
      color: #FFFFFF;
      border: none;
      border-radius: var(--aris-radius);
      font-size: 15.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-action-primary:hover:not(:disabled) {
      background: var(--aris-blue-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -4px rgba(47, 111, 237, 0.35);
    }
    .btn-action-primary:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-action-primary:disabled {
      opacity: 0.85;
      cursor: not-allowed;
      transform: none !important;
    }

    .pod-annotation {
      font-size: 12.5px;
      color: var(--aris-text-muted);
      text-align: center;
      margin-top: 14px;
      line-height: 1.45;
    }

    /* Separation Line */
    .pod-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 26px 0 22px;
      color: #94A3B8;
      font-size: 12px;
      text-transform: lowercase;
    }
    .pod-divider::before, .pod-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--aris-border);
    }

    /* Social Auth Grid */
    .social-dock {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .social-btn {
      height: 48px;
      background: #FFFFFF;
      border: 1px solid var(--aris-border);
      border-radius: var(--aris-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .social-btn:hover:not(:disabled) {
      background: #F8FAFC;
      border-color: #94A3B8;
    }
    .social-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .social-btn svg {
      width: 19px;
      height: 19px;
    }

    /* Specialized State Views */
    .state-check-email {
      text-align: center;
      padding: 10px 0;
    }
    .state-badge-icon {
      width: 68px;
      height: 68px;
      border-radius: 999px;
      background: #EFF5FF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
      color: var(--aris-blue);
      box-shadow: 0 0 0 10px rgba(47, 111, 237, 0.05);
    }
    .state-badge-icon svg {
      width: 32px;
      height: 32px;
      stroke: var(--aris-blue);
      stroke-width: 2.2;
      fill: none;
    }
    .target-address {
      font-weight: 700;
      color: var(--aris-text-main);
      word-break: break-all;
    }
    .btn-secondary-action {
      width: 100%;
      height: 48px;
      background: #F8FAFC;
      border: 1px solid var(--aris-border);
      border-radius: var(--aris-radius);
      color: var(--aris-text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 24px;
      transition: all 0.15s;
    }
    .btn-secondary-action:hover:not(:disabled) {
      background: #EFF5FF;
      border-color: #BFDBFE;
      color: var(--aris-blue);
    }
    .btn-secondary-action:disabled {
      color: #94A3B8;
      cursor: not-allowed;
    }
    .btn-back-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--aris-blue);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-back-link:hover { text-decoration: underline; }

    /* Provider Unavailable Banner */
    .provider-alert {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #92400E;
      margin-bottom: 20px;
      line-height: 1.45;
    }

    /* Animated Mini Spinner */
    .spinner-disc {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.35);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spinRound 0.75s linear infinite;
    }
    @keyframes spinRound { to { transform: rotate(360deg); } }

    /* Footer */
    .site-footer {
      padding: 24px 64px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--aris-text-muted);
      z-index: 20;
    }
    .footer-nav {
      display: flex;
      gap: 24px;
    }
    .footer-nav a {
      color: var(--aris-text-muted);
      text-decoration: none;
    }
    .footer-nav a:hover { color: var(--aris-blue); }

    /* ==========================================================================
       ORBIT ARTWORK
       The panel exists so the light strokes have something to sit on. The old
       sculpture used #F8FAFC on a #FAFBFC page, about a 1% luminance
       difference, so half the form was simply invisible.
       ========================================================================== */
    .orbit-ring {
      fill: none;
      stroke: #AFC0D8;
      stroke-width: 1.5;
      stroke-linecap: round;
    }
    .orbit-ring--soft  { stroke: #C6D3E5; stroke-width: 1.3; }
    .orbit-ring--faint { stroke: #DCE4F0; stroke-width: 1.1; }
    .orbit-dust circle { fill: #B9C8DD; }
    .orbit-sheen { fill: url(#discSheen); }
    .orbit-bloom { fill: url(#coreBloom); }
    .orbit-core-spec { fill: #FFFFFF; opacity: 0.55; }
    .orbit-milestone--dim { fill: #CBD7E7; }
    .orbit-waypoint {
      fill: #FFFFFF;
      stroke: #7FA8F2;
      stroke-width: 2.5;
    }
    .orbit-trajectory {
      fill: none;
      stroke: url(#trajectoryGrad);
      stroke-width: 7.5;
      stroke-linecap: round;
      transition: stroke 0.35s ease;
    }
    .orbit-figure.is-fault .orbit-waypoint { stroke: #E7B4B4; }
    .orbit-core { fill: url(#coreGrad); }
    .orbit-core-halo { fill: rgba(47, 111, 237, 0.10); }
    .orbit-milestone { fill: #B6C5DA; }
    .orbit-node {
      fill: #FFFFFF;
      stroke: var(--aris-blue);
      stroke-width: 4.5;
      transition: stroke 0.35s ease;
    }
    .orbit-node-glow {
      fill: var(--aris-blue);
      opacity: 0.16;
      transition: opacity 0.35s ease, r 0.35s ease;
    }

    /* Fault states recolour the trajectory. No motion: an error is not an
       occasion for the artwork to start dancing. */
    .orbit-figure.is-fault .orbit-trajectory { stroke: #E9A8A8; }
    .orbit-figure.is-fault .orbit-node { stroke: var(--aris-danger); }
    .orbit-figure.is-fault .orbit-node-glow { fill: var(--aris-danger); opacity: 0.14; }

    .orbit-figure.is-working .orbit-node-glow { opacity: 0.3; r: 19; }

    /* One entrance, then the artwork is still. Nothing loops while idle.
       The finished look is the DEFAULT; .is-entering only adds the reveal, and
       JS removes it once, so a later re-render can never strand the drawing
       half finished. */
    .orbit-figure.is-entering .orbit-draw {
      stroke-dasharray: var(--len, 1200);
      stroke-dashoffset: var(--len, 1200);
      animation: orbitDraw 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .orbit-figure.is-entering .orbit-draw--2 { animation-delay: 0.08s; }
    .orbit-figure.is-entering .orbit-draw--3 { animation-delay: 0.16s; }
    .orbit-figure.is-entering .orbit-draw--path { animation-delay: 0.26s; animation-duration: 1.3s; }
    @keyframes orbitDraw { to { stroke-dashoffset: 0; } }

    .orbit-figure.is-entering .orbit-fade {
      opacity: 0;
      animation: orbitFade 0.6s ease forwards;
      animation-delay: 0.95s;
    }
    @keyframes orbitFade { to { opacity: 1; } }

    .orbit-ripple {
      fill: none;
      stroke: var(--aris-blue);
      stroke-width: 2;
      opacity: 0;
    }
    .orbit-figure.is-resolved .orbit-ripple {
      animation: orbitRipple 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes orbitRipple {
      0%   { opacity: 0.5; r: 16; }
      100% { opacity: 0;   r: 74; }
    }

    /* ==========================================================================
       RESPONSIVE ADAPTATIONS (Desktop 1440px -> Laptop 1024px -> Mobile 390px)
       ========================================================================== */
    @media (max-width: 1080px) {
      .site-header { padding: 28px 40px 16px; }
      .stage-main {
        grid-template-columns: 1fr 380px;
        gap: 36px;
        padding: 10px 40px 30px;
      }
      .visual-theater { height: 420px; }
      .hero-headline { font-size: 48px; }
      .site-footer { padding: 20px 40px 24px; }
    }

    @media (max-width: 820px) {
      .stage-main {
        display: flex;
        flex-direction: column;
        padding: 10px 20px 40px;
        gap: 16px;
      }
      .left-hero-column {
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
      .left-hero-column { display: flex; }
      .visual-theater { height: 250px; margin-left: 0; order: 1; }
      .hero-narrative { order: 2; }
      .hero-narrative {
        order: 2;
        text-align: center;
        max-width: 100%;
        padding-bottom: 0;
        margin-top: 4px;
      }
      .hero-caption { margin-bottom: 8px; font-size: 11px; }
      .hero-headline {
        font-size: 30px;
        line-height: 1.15;
        margin-bottom: 8px;
      }
      .hero-subheadline {
        font-size: 14px;
        max-width: 320px;
        margin: 0 auto 12px;
      }
      .form-stage {
        order: 3;
        width: 100%;
      }
      .form-pod {
        width: 100%;
        max-width: 100%;
        padding: 28px 20px;
        border-radius: 20px;
      }
      .site-header { padding: 18px 20px 10px; }
      .site-footer {
        flex-direction: column;
        gap: 12px;
        padding: 20px 20px;
        text-align: center;
      }
      .dev-panel {
        bottom: 8px;
        padding: 6px 12px;
        max-width: 95vw;
        overflow-x: auto;
      }
    }

    /* Accessibility reduced-motion. The entrance draw and the ripple are
       removed outright rather than sped up, and the working state stops
       travelling: the JS checks this query too. */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .orbit-figure.is-entering .orbit-draw {
        stroke-dasharray: none;
        stroke-dashoffset: 0;
        animation: none;
      }
      .orbit-figure.is-entering .orbit-fade { opacity: 1; animation: none; }
      .orbit-figure.is-resolved .orbit-ripple { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Dev Testing Switcher Panel (Collapsible for Clean Export) -->
  <aside class="dev-panel" id="devPanel" aria-label="Bộ điều khiển kiểm thử giao diện">
    <span class="dev-title">
      <span>Trạng thái</span>
      <span style="font-size:10px; background:#334155; padding:2px 6px; border-radius:4px;">V2</span>
    </span>
    <button class="dev-btn active" onclick="setScreenState('default')">1. Default</button>
    <button class="dev-btn" onclick="setScreenState('loading')">2. Loading</button>
    <button class="dev-btn" onclick="setScreenState('check-email')">3. Check Email</button>
    <button class="dev-btn" onclick="setScreenState('error')">4. Invalid Email</button>
    <button class="dev-btn" onclick="setScreenState('send-failure')">5. Send Failure</button>
    <button class="dev-btn" onclick="setScreenState('cooldown')">6. Cooldown</button>
    <button class="dev-btn" onclick="setScreenState('provider-unavailable')">7. Provider Down</button>
    <button class="dev-toggle-hide" title="Ẩn thanh điều khiển (Nhấn phím D để hiện lại)" onclick="toggleDevPanel()">✕</button>
  </aside>

  <div class="app-shell">
    
    <!-- Top Brand Header -->
    <header class="site-header">
      <a href="#" class="brand-group" aria-label="Aris Career Studio Trang chủ">
        <svg class="brand-mark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="brandLogoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#2F6FED"/>
              <stop offset="100%" stop-color="#7EC8F5"/>
            </linearGradient>
          </defs>
          <path d="M 30,145 C 65,180 125,160 120,115 C 115,70 70,70 70,115 C 70,150 115,95 170,30" fill="none" stroke="url(#brandLogoGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-title">Aris</span>
      </a>

      <div class="header-aside">
        Chưa có tài khoản? <a href="#">Đăng ký ngay</a>
      </div>
    </header>

    <!-- Main Dynamic Stage -->
    <main class="stage-main">

      <!-- Left Column / Narrative & 3D Stage -->
      <div class="left-hero-column">

        <!-- Orbit artwork. Concentric rings are the ground you stand on; the
             blue trajectory is the one that leaves the plane, which is the
             "Đi xa hơn" idea, drawn in the same stroke language as the logo. -->
        <section class="visual-theater" aria-hidden="true">
          <div class="orbit-figure" id="orbitFigure">
            <svg class="orbit-source" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
              <path id="arisMarkPath"
                    d="M 30,145 C 65,180 125,160 120,115 C 115,70 70,70 70,115 C 70,150 115,95 170,30"/>
            </svg>
            <canvas id="orbitCanvas"></canvas>
          </div>
        </section>

        <!-- Headline in Negative Space -->
        <section class="hero-narrative">
          <span class="hero-caption">QUỸ ĐẠO MỚI</span>

            Đi xa hơn.<br>
            Theo cách của bạn.
          </h1>
          <p class="hero-subheadline">
            Nền tảng công nghệ kết nối năng lực thực chất của bạn với những nấc thang sự nghiệp xứng tầm.
          </p>
        </section>

      </div>

      <!-- Right Login Interaction Pod -->
      <section class="form-stage">
        <div class="form-pod" id="formPod">
          <!-- Dynamically populated by JS renderPod() -->
        </div>

    </main>

    <!-- Clean Legal Footer -->
    <footer class="site-footer">
      <div>© 2026 Aris Career Platform. Tất cả quyền được bảo lưu.</div>
      <nav class="footer-nav" aria-label="Liên kết chính sách">
        <a href="#">Trợ giúp</a>
        <a href="#">Điều khoản</a>
        <a href="#">Quyền riêng tư</a>
      </nav>
    </footer>

  </div>

  <script>
    /* ==========================================================================
       1. FORM STATE MACHINE & SIMULATION LOGIC
       ========================================================================== */
    let currentAppState = 'default';
    let userEnteredEmail = '';
    let cooldownRemaining = 45;
    let cooldownTimer = null;

    function setScreenState(state) {
      currentAppState = state;
      document.querySelectorAll('.dev-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase().includes(state.replace('-', ' ')));
      });
      renderPod();

      // Artwork follows the application state. Faults recolour without
      // moving; only a real in-flight request animates.
      const art = window.sculptureInstance;
      if (art) {
        const faultStates = ['error', 'send-failure', 'provider-unavailable', 'cooldown'];
        art.setFault(faultStates.indexOf(state) !== -1);

        if (state === 'loading') {
          art.triggerLoadingPulse(true);
        } else if (state === 'check-email') {
          art.triggerLoadingPulse(false);
          art.triggerSettlingGesture();
        } else {
          art.reset();
        }
      }
    }

    function toggleDevPanel() {
      const p = document.getElementById('devPanel');
      p.classList.toggle('minimized');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'd' || e.key === 'D') {
        if (document.activeElement.tagName !== 'INPUT') {
          toggleDevPanel();
        }
      }
    });

    function renderPod() {
      const pod = document.getElementById('formPod');

      // State 4: Check Email Screen
      if (currentAppState === 'check-email') {
        pod.innerHTML = `
          <div class="state-check-email">
            <div class="state-badge-icon">
              <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
            <h2 class="pod-heading">Kiểm tra email của bạn</h2>
            <p class="pod-desc">
              Chúng tôi vừa gửi liên kết đăng nhập an toàn tới <br>
              <span class="target-address">${userEnteredEmail || 'ban@example.com'}</span>.<br><br>
              Vui lòng mở email và nhấn vào liên kết để tiếp tục (kể cả mục Thư rác/Spam).
            </p>
            <button class="btn-secondary-action" id="cooldownBtn" disabled onclick="handleResendTrigger()">
              Gửi lại liên kết (${cooldownRemaining}s)
            </button>
            <div>
              <a class="btn-back-link" onclick="setScreenState('default')">← Đổi địa chỉ email khác</a>
            </div>
          </div>
        `;
        startCooldownTimer();
        return;
      }

      // States: default, loading, error, send-failure, cooldown, provider-unavailable
      const isError = (currentAppState === 'error');
      const isLoading = (currentAppState === 'loading');
      const isSendFailure = (currentAppState === 'send-failure');
      const isCooldown = (currentAppState === 'cooldown');
      const isProviderDown = (currentAppState === 'provider-unavailable');

      pod.innerHTML = `
        <h2 class="pod-heading">Chào mừng trở lại.</h2>
        <p class="pod-desc">Tiếp tục hành trình cùng Aris.</p>

        ${isProviderDown ? `
          <div class="provider-alert" role="alert">
            <strong>Lưu ý:</strong> Đăng nhập bằng Google đang bảo trì cập nhật. Bạn vẫn có thể nhập Email để nhận liên kết đăng nhập bình thường.
          </div>
        ` : ''}

        ${isSendFailure ? `
          <div class="error-announcement" style="margin-bottom:18px;" role="alert">
            <svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
            <span>Không thể kết nối máy chủ gửi thư lúc này. Địa chỉ của bạn đã được lưu lại, vui lòng thử gửi lại.</span>
          </div>
        ` : ''}

        <form onsubmit="handleFormSubmission(event)">
          <div class="control-group">
            <label class="control-label" for="txtEmail">Email</label>
            <input
              id="txtEmail"
              type="text"
              class="control-input ${isError ? 'input-error' : ''}"
              placeholder="ban@example.com"
              value="${isError ? 'email-khong-hop-le' : (isLoading ? 'nguyenvana@gmail.com' : userEnteredEmail)}"
              ${isLoading ? 'disabled' : ''}
              onfocus="handleInputFocus(true)"
              onblur="handleInputFocus(false)"
              aria-invalid="${isError}"
              aria-describedby="${isError ? 'errInline' : ''}"
              required
            />
            ${isError ? `
              <div class="error-announcement" id="errInline" role="alert">
                <svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                <span>Email chưa đúng định dạng. Vui lòng nhập dạng ten@domain.com</span>
              </div>
            ` : ''}
          </div>

          <button type="submit" class="btn-action-primary" ${isLoading || isCooldown ? 'disabled' : ''}>
            ${isLoading ? `
              <div class="spinner-disc"></div>
              <span>Đang gửi…</span>
            ` : (isCooldown ? `
              <span>Đợi gửi lại (40s)</span>
            ` : `
              <span>Gửi liên kết đăng nhập</span>
            `)}
          </button>

          <p class="pod-annotation">
            Không cần mật khẩu. Nhận liên kết đăng nhập qua email.
          </p>

          <div class="pod-divider">
            <span>hoặc tiếp tục với</span>
          </div>

          <div class="social-dock">
            <button type="button" class="social-btn" ${isLoading || isProviderDown ? 'disabled' : ''} onclick="alert('Mô phỏng chuyển hướng đăng nhập Google')">
              <svg viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/></svg>
              <span>Google</span>
            </button>
            <button type="button" class="social-btn" ${isLoading ? 'disabled' : ''} onclick="alert('Mô phỏng chuyển hướng đăng nhập Facebook')">
              <svg viewBox="0 0 18 18"><path fill="#1877F2" d="M18 9a9 9 0 1 0-10.406 8.89v-6.29H5.31V9h2.284V7.017c0-2.255 1.343-3.501 3.4-3.501.985 0 2.014.176 2.014.176v2.215h-1.135c-1.118 0-1.467.694-1.467 1.406V9h2.497l-.4 2.6h-2.097v6.29A9.002 9.002 0 0 0 18 9z"/></svg>
              <span>Facebook</span>
            </button>
          </div>
        </form>
      `;
    }

    function handleInputFocus(focused) {
      /* Kept for the inline handlers, but the artwork is driven by delegated
         focusin/focusout in ArisField. The old call here was to a method that
         never existed and threw on every focus. */
      void focused;
      return;
      /* eslint-disable no-unreachable */
      if (window.sculptureInstance) {
        window.sculptureInstance.setFocusDamping(focused);
      }
    }

    function handleFormSubmission(e) {
      e.preventDefault();
      const input = document.getElementById('txtEmail');
      const val = input.value.trim();
      if (!val || !val.includes('@') || !val.includes('.')) {
        setScreenState('error');
        return;
      }
      userEnteredEmail = val;
      setScreenState('loading');
      setTimeout(() => {
        setScreenState('check-email');
      }, 1600);
    }

    function startCooldownTimer() {
      clearInterval(cooldownTimer);
      cooldownRemaining = 45;
      const btn = document.getElementById('cooldownBtn');
      if (!btn) return;
      btn.disabled = true;
      cooldownTimer = setInterval(() => {
        cooldownRemaining--;
        if (cooldownRemaining <= 0) {
          clearInterval(cooldownTimer);
          btn.disabled = false;
          btn.textContent = 'Gửi lại liên kết';
        } else {
          btn.textContent = `Gửi lại liên kết (${cooldownRemaining}s)`;
        }
      }, 1000);
    }

    function handleResendTrigger() {
      alert('Đã gửi lại liên kết mô phỏng tới ' + userEnteredEmail);
      startCooldownTimer();
    }

    /* ==========================================================================
       2. ARIS SCULPTURE — the brand mark rendered as a particle body

       Concept after Codex's review. Earlier passes kept making the field the
       hero: first a thin SVG curve, then a spiral, then a sphere. All of them
       sat close to the "generic particle field" the art direction explicitly
       rejects, because none of them was shaped like anything that belongs to
       Aris.

       So the hero IS the Aris mark. The centreline is sampled straight from a
       hidden copy of the real logo path, given depth in z, and clothed in
       thousands of particles. A sparse dust system sits behind it for scale.
       If the still frame reads as the Aris swoosh, it is identity; if it reads
       as sparkles, the idea failed - which is the test Codex set.

       Motion, per the art direction's choreography rather than the reference
       pages: a 1.9s reveal, then near stillness with a very small drift, real
       rest periods, and it settles almost completely while the email field has
       focus. Only the travelling highlight speeds up while loading.
       ========================================================================== */
    class ArisField {
      constructor(canvasId, figureId) {
        this.canvas = document.getElementById(canvasId);
        this.figure = document.getElementById(figureId);
        this.src = document.getElementById('arisMarkPath');
        if (!this.canvas || !this.src) { throw new Error('Sculpture markup missing'); }
        this.ctx = this.canvas.getContext('2d');

        this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        this.rotY = -0.12; this.rotX = 0.05;
        this.targetY = -0.12; this.targetX = 0.05;
        this.px = 0; this.py = 0; this.pointerInside = false;
        this.t = 0;                 // seconds since start, for drift and rest
        this.reveal = this.reduced ? 1 : 0;
        this.energy = 0; this.energyTarget = 0;
        this.calm = 0;              // 1 while the email field has focus
        this.calmTarget = 0;
        this.attenuate = 0;         // restrained warm dimming on a form fault
        this.attenuateTarget = 0;
        this.phase = 0;
        this.raf = null;

        this.build();
        this.resize();

        window.addEventListener('resize', () => this.resize());
        window.addEventListener('pointermove', (e) => this.onPointer(e), { passive: true });
        // The pod is re-rendered per state, so focus is watched by delegation.
        document.addEventListener('focusin', (e) => {
          if (e.target && e.target.id === 'txtEmail') { this.calmTarget = 1; }
        });
        document.addEventListener('focusout', (e) => {
          if (e.target && e.target.id === 'txtEmail') { this.calmTarget = 0; }
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) { this.stop(); } else { this.start(); }
        });

        if (this.reduced) { this.draw(0); } else { this.start(); }
      }

      /* ---- geometry: clothe the real brand path in particles -------------- */
      build() {
        const len = this.src.getTotalLength();
        const SAMPLES = 700;
        const spine = [];
        for (let i = 0; i < SAMPLES; i++) {
          const u = i / (SAMPLES - 1);
          const p = this.src.getPointAtLength(u * len);
          // 200x200 viewBox -> centred -1..1, y flipped for screen space.
          const x = (p.x - 100) / 92;
          const y = -(p.y - 100) / 92;
          // Depth: the loop swings back, the rising tail comes forward, so the
          // mark is a body in space rather than a flat decal.
          const z = Math.sin(u * 3.25 - 0.5) * 0.20;
          spine.push({ x: x, y: y, z: z, u: u });
        }
        this.spine = spine;

        // Stroke thickness tapers at both ends, fattest through the loop.
        const thick = (u) => 0.021 * (0.62 + Math.sin(Math.min(1, Math.max(0, u)) * Math.PI) * 0.45);

        this.grains = [];
        for (let i = 1; i < SAMPLES; i++) {
          const a = spine[i - 1], b = spine[i];
          const tx = b.x - a.x, ty = b.y - a.y, tz = b.z - a.z;
          const tl = Math.hypot(tx, ty, tz) || 1;
          // Any two vectors perpendicular to the tangent will do for scatter.
          let nx = -ty / tl, ny = tx / tl, nz = 0;
          const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl;
          const bx = ty * nz - tz * ny, by = tz * nx - tx * nz, bz = tx * ny - ty * nx;
          const bl = Math.hypot(bx, by, bz) || 1;

          const r = thick(b.u);
          const PER = 9;
          for (let j = 0; j < PER; j++) {
            // Gaussian-ish falloff so the stroke has a bright spine and a
            // soft edge instead of a hard tube.
            const g = (Math.random() + Math.random() + Math.random()) / 3 * 2 - 1;
            const g2 = (Math.random() + Math.random() + Math.random()) / 3 * 2 - 1;
            // Three tiers instead of two: a narrow bright core, a wider body
            // at low opacity, and sparse outliers. Material comes from the
            // lighting tiers, not from thickening the stroke, so the loop's
            // negative space survives.
            const rad = Math.hypot(g, g2);
            const core = rad < 0.26;
            const body = !core && rad < 0.72;
            this.grains.push({
              x: b.x + (nx * g + (bx / bl) * g2) * r,
              y: b.y + (ny * g + (by / bl) * g2) * r,
              z: b.z + ((bz / bl) * g2) * r,
              u: b.u,
              s: core ? 1.7 + Math.random() * 2.4 : (body ? 0.8 + Math.random() * 1.1 : 0.5 + Math.random() * 0.7),
              a: core ? 0.82 + Math.random() * 0.18 : (body ? 0.26 + Math.random() * 0.3 : 0.12 + Math.random() * 0.18),
              core: core,
              // Mostly white with warm sparks, matching the reference restraint.
              c: Math.random() < 0.055 ? '247,196,120'
                 : (Math.random() < 0.28 ? '138,186,255' : '232,241,255'),
              // Where the grain starts during the reveal.
              rx: (Math.random() - 0.5) * 2.6,
              ry: (Math.random() - 0.5) * 2.2,
              rz: (Math.random() - 0.5) * 1.6
            });
          }
        }

        // Sparse dust for scale. Deliberately faint: it frames the mark, it is
        // not the subject.
        // Codex: localized clusters, not a global opacity lift. Even dust
        // reads as noise; clumped dust reads as depth.
        this.dust = [];
        const CLUSTERS = 7;
        for (let c = 0; c < CLUSTERS; c++) {
          const th = Math.random() * Math.PI * 2;
          const rr = 1.0 + Math.random() * 1.15;
          const ox = Math.cos(th) * rr, oz = Math.sin(th) * rr;
          const oy = (Math.random() - 0.5) * 1.3;
          const n = 60 + Math.floor(Math.random() * 90);
          const spread = 0.16 + Math.random() * 0.26;
          for (let i = 0; i < n; i++) {
            this.dust.push({
              x: ox + (Math.random() - 0.5) * spread * 2,
              y: oy + (Math.random() - 0.5) * spread * 1.4,
              z: oz + (Math.random() - 0.5) * spread * 2,
              s: 0.45 + Math.random() * 0.9,
              a: 0.09 + Math.random() * 0.26
            });
          }
        }
      }

      onPointer(e) {
        const r = this.canvas.getBoundingClientRect();
        this.px = ((e.clientX - r.left) / r.width) * 2 - 1;
        this.py = ((e.clientY - r.top) / r.height) * 2 - 1;
        this.pointerInside = true;
        // Bounded parallax, never a free spin.
        this.targetY = -0.12 + this.px * 0.42;
        this.targetX = 0.05 + this.py * 0.2;
      }

      resize() {
        const r = this.canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.w = Math.max(1, Math.round(r.width));
        this.h = Math.max(1, Math.round(r.height));
        this.canvas.width = Math.round(this.w * dpr);
        this.canvas.height = Math.round(this.h * dpr);
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.scale = Math.min(this.w * 0.33, this.h * 0.62);
        if (this.reduced) { this.draw(0); }
      }

      start() {
        if (this.raf || this.reduced) { return; }
        this.last = performance.now();
        const loop = (now) => {
          const dt = Math.min(0.05, (now - this.last) / 1000);
          this.last = now;
          this.draw(dt);
          this.raf = requestAnimationFrame(loop);
        };
        this.raf = requestAnimationFrame(loop);
      }
      stop() { if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; } }

      draw(dt) {
        const ctx = this.ctx, w = this.w, h = this.h;
        this.t += dt;
        if (this.reveal < 1) { this.reveal = Math.min(1, this.reveal + dt / 0.55); }
        this.calm += (this.calmTarget - this.calm) * Math.min(1, dt * 3.5);
        this.energy += (this.energyTarget - this.energy) * Math.min(1, dt * 3.0);
        this.attenuate += (this.attenuateTarget - this.attenuate) * Math.min(1, dt * 2.5);
        this.phase += dt * (0.13 + this.energy * 1.35);

        // Drift with genuine rest: the envelope spends part of its cycle at
        // zero, so the sculpture actually stops rather than never settling.
        const cyc = (this.t % 14) / 14;
        const wake = Math.max(0, Math.sin(cyc * Math.PI * 2)) * (1 - this.calm * 0.92);
        const driftY = Math.sin(this.t * 0.22) * 0.05 * wake;
        const driftX = Math.cos(this.t * 0.17) * 0.026 * wake;

        const rev = 1 - Math.pow(1 - this.reveal, 3);
        this.rotY += ((this.targetY + driftY) - this.rotY) * Math.min(1, dt * 2.4);
        this.rotX += ((this.targetX + driftX) - this.rotX) * Math.min(1, dt * 2.4);

        ctx.clearRect(0, 0, w, h);
        const cx = w * 0.46, cy = h * 0.60;
        const cY = Math.cos(this.rotY), sY = Math.sin(this.rotY);
        const cX = Math.cos(this.rotX), sX = Math.sin(this.rotX);
        const FOV = 4.0, R = this.scale;

        const bl = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.25);
        const bi = (0.15 + this.energy * 0.16) * rev * (1 - this.attenuate * 0.4);
        bl.addColorStop(0, 'rgba(70,132,246,' + bi.toFixed(3) + ')');
        bl.addColorStop(0.55, 'rgba(47,111,237,' + (bi * 0.22).toFixed(3) + ')');
        bl.addColorStop(1, 'rgba(47,111,237,0)');
        ctx.fillStyle = bl; ctx.fillRect(0, 0, w, h);

        const project = (x, y, z) => {
          const x1 = x * cY - z * sY;
          const z1 = x * sY + z * cY;
          const y2 = y * cX - z1 * sX;
          const z2 = y * sX + z1 * cX;
          const k = FOV / (FOV + z2);
          return [cx + x1 * k * R, cy - y2 * k * R, k, z2, x1, y2];
        };

        // Dust first, always behind.
        for (let i = 0; i < this.dust.length; i++) {
          const d = this.dust[i];
          const q = project(d.x, d.y, d.z);
          const al = d.a * rev * (0.45 + (q[2] - 0.8) * 1.1);
          if (al <= 0.01) { continue; }
          ctx.fillStyle = 'rgba(190,210,245,' + Math.min(1, al).toFixed(3) + ')';
          ctx.fillRect(q[0], q[1], d.s * q[2], d.s * q[2]);
        }

        // The sculpture. A highlight travels the mark from tail to tip.
        const head = this.phase % 1;
        const glow = [];
        for (let i = 0; i < this.grains.length; i++) {
          const g = this.grains[i];
          // Reveal: grains fly in from scatter to their place on the mark.
          // Codex: particle assembly is a campaign move, not a utility entry
          // point. The mark is fully formed at first paint and only its
          // luminance settles, then the light pass runs.
          const m = rev;
          const q = project(g.x, g.y, g.z);

          let d = head - g.u; if (d < 0) { d += 1; }
          const band = Math.exp(-d * 7.5);
          const depth = (q[2] - 0.78) / 0.44;
          // Asymmetric key light from the upper left, so the body has a lit
          // side and a shadowed side instead of uniform glow.
          const key = 0.72 + 0.46 * Math.max(0, (-q[4] * 0.55 + q[5] * 0.5 + 0.5));
          const nearBoost = q[3] < 0 ? 1.22 : 0.86;
          let al = g.a * (0.3 + depth * 0.72) * m * key
                 + band * (g.core ? 0.55 : 0.2) * (0.55 + this.energy * 0.45);
          al *= (1 - this.attenuate * 0.45);
          al = Math.max(0, Math.min(1, al));
          const sz = Math.max(0.6, (g.s * nearBoost + band * (g.core ? 1.7 : 0.5)) * q[2]);
          const col = this.attenuate > 0.5 ? '245,205,190' : g.c;
          ctx.fillStyle = 'rgba(' + col + ',' + al.toFixed(3) + ')';
          ctx.fillRect(q[0], q[1], sz, sz);
          if (g.core && (band > 0.3 || g.s > 3.0)) { glow.push([q[0], q[1], sz, al]); }
        }

        // Soft bloom on the brightest grains only: this is what separates a
        // lit body from a field of hard squares.
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < glow.length; i++) {
          const q = glow[i];
          const rad = q[2] * 2.1;
          const gr = ctx.createRadialGradient(q[0], q[1], 0, q[0], q[1], rad);
          gr.addColorStop(0, 'rgba(150,195,255,' + (q[3] * 0.26).toFixed(3) + ')');
          gr.addColorStop(1, 'rgba(150,195,255,0)');
          ctx.fillStyle = gr;
          ctx.fillRect(q[0] - rad, q[1] - rad, rad * 2, rad * 2);
        }
        ctx.globalCompositeOperation = 'source-over';
      }

      /* ---- state API ------------------------------------------------------ */
      triggerLoadingPulse(active) {
        this.energyTarget = active ? 1 : 0;
        if (this.figure) { this.figure.classList.toggle('is-working', !!active); }
      }
      triggerSettlingGesture() {
        this.energyTarget = 0;
        this.phase = 0.97;            // park the highlight at the mark's tip
      }
      setFault(f) {
        // Codex: keep errors in the form. The sculpture only dims slightly.
        this.attenuateTarget = f ? 1 : 0;
        if (this.figure) { this.figure.classList.toggle('is-fault', !!f); }
        if (this.reduced) { this.draw(0); }
      }
      reset() {
        this.energyTarget = 0;
        if (this.figure) { this.figure.classList.remove('is-working'); }
      }
    }

    // Initialize application & handle query parameters
    window.addEventListener('DOMContentLoaded', () => {
      // Check for clean mode (hides dev panel for presentation/evidence capture)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('clean') === 'true' || window.location.hash.includes('clean')) {
        document.getElementById('devPanel').classList.add('dev-hidden');
      }

      // Check for state param (?state=loading, check-email, error, send-failure, cooldown, provider-unavailable)
      const requestedState = urlParams.get('state');
      if (requestedState) {
        currentAppState = requestedState;
      }

      renderPod();

      try {
        window.sculptureInstance = new ArisField('orbitCanvas', 'orbitFigure');
        if (requestedState) {
          setScreenState(requestedState);
        }
      } catch (err) {
        console.warn('Orbit artwork init failed:', err);
      }
    });
  </script>
</body>
</html>
